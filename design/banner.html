<!doctype html>
<!--
  Banner artwork for the README and the GitHub social preview.
  Rendered by scripts/make-banners.sh (headless Chrome): banner.html#readme → .github/assets/banner.jpg,
  banner.html#social → .github/assets/social-preview.jpg. Screenshots come from .github/assets/.
  Look: the app's own near-black, one soft coral light behind the screens, film grain and a gentle vignette.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: #070606; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; color: #f4ece7; -webkit-font-smoothing: antialiased; }

  /* the app's background (#050506 → #0c0a0b), not brown: neutral black with one coral light behind the screens */
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(40% 66% at 74% 50%, rgba(255, 122, 89, .17), rgba(255, 122, 89, .05) 50%, transparent 75%),
      radial-gradient(30% 45% at 96% 2%, rgba(150, 52, 82, .16), transparent 70%),
      radial-gradient(45% 70% at 14% 62%, rgba(255, 122, 89, .045), transparent 70%),
      linear-gradient(180deg, #0c0a0b, #060506); }

  .copy { position: absolute; z-index: 6; display: flex; flex-direction: column; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: #e99d84; }
  .eyebrow img { width: 46px; height: 46px; border-radius: 13px; box-shadow: 0 10px 24px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .07); }
  h1 { margin-top: 18px; font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif; font-weight: 600; font-size: 92px;
    letter-spacing: -.02em; line-height: .95; color: #f8efea; text-shadow: 0 0 30px rgba(255, 122, 89, .16); }
  .tag { margin-top: 22px; font-size: 23px; line-height: 1.45; color: #c9bfc1; max-width: 540px; }
  .tag em { font-family: ui-serif, "New York", Georgia, serif; font-style: italic; color: #ffc0ad; font-size: 1.08em; }
  .feats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 30px; font-size: 15px; font-weight: 500; color: #b5aaad; }
  .feats span { display: inline-flex; align-items: center; gap: 8px; }
  .feats svg { width: 17px; height: 17px; fill: none; stroke: #ff9a7e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .credit { margin-top: 26px; font-size: 13px; letter-spacing: .02em; color: #6f676a; }
  .credit .heart { color: #8a8185; font-family: ui-sans-serif, system-ui, sans-serif; }
  .credit b { color: #a59c9f; font-weight: 600; }
  .credit i { color: #463f42; font-style: normal; margin: 0 9px; }

  .window { position: absolute; z-index: 3; border-radius: 18px; overflow: hidden; background: #0c0a0b;
    box-shadow: 0 60px 120px rgba(0, 0, 0, .8), 0 0 90px rgba(255, 122, 89, .1), 0 0 0 1px rgba(255, 255, 255, .08); }
  .window .bar { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #151214; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .window .bar i { width: 11px; height: 11px; border-radius: 50%; background: #35302f; }
  .window img, .phone img { display: block; width: 100%; }
  .phone { position: absolute; z-index: 5; border-radius: 36px; overflow: hidden; background: #000;
    box-shadow: 0 46px 90px rgba(0, 0, 0, .85), 0 0 60px rgba(255, 122, 89, .08), 0 0 0 8px #141113, 0 0 0 9px rgba(255, 255, 255, .1); }

  /* vignette + grain on top of everything */
  .vignette { position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 50%, transparent 58%, rgba(0, 0, 0, .55) 100%); }
  .grain { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: .15; mix-blend-mode: overlay; }
  .grain.fine { opacity: .07; mix-blend-mode: normal; }

  /* ── social preview 1280×640 ── */
  .social .copy { left: 78px; top: 0; bottom: 6px; justify-content: center; width: 580px; }
  /* both screens fully in frame: the desktop window (with its playlist) top-right, the phone in front of its
     lower-left corner so the mini player at the bottom of the phone shows */
  .social .window { left: 686px; top: 64px; width: 566px; }
  .social .phone { left: 652px; top: 262px; width: 160px; border-radius: 26px; }

  /* ── README banner 1280×420 ── */
  .readme h1 { font-size: 78px; margin-top: 14px; }
  .readme .eyebrow { font-size: 13px; }
  .readme .eyebrow img { width: 40px; height: 40px; border-radius: 11px; }
  .readme .tag { font-size: 20px; margin-top: 16px; max-width: 500px; }
  .readme .feats { margin-top: 22px; font-size: 13.5px; gap: 6px 18px; }
  .readme .feats svg { width: 15px; height: 15px; }
  .readme .credit { margin-top: 18px; font-size: 12px; }
  .readme .credit .plat { display: none; }
  .readme .copy { left: 72px; top: 0; bottom: 0; justify-content: center; width: 560px; }
  .readme .window { left: 712px; top: 34px; width: 520px; }
  .readme .phone { left: 662px; top: 112px; width: 128px; border-radius: 22px; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="window"><div class="bar"><i></i><i></i><i></i></div><img src="../.github/assets/screenshot-desktop.jpg" alt=""></div>
    <div class="phone"><img src="../.github/assets/screenshot-phone.jpg" alt=""></div>

    <div class="copy">
      <div class="eyebrow"><img src="icon-source.png" alt="">A vinyl player that listens</div>
      <h1>Gramophone</h1>
      <p class="tag">Drop in a song and watch it spin while it <em>sings the melody back</em> — hooks, key and tempo included.</p>
      <div class="feats">
        <span><svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg>Melody</span>
        <span><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/></svg>Hooks</span>
        <span><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Key &amp; BPM</span>
        <span><svg viewBox="0 0 24 24"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.69M19 12.86a10 10 0 0 0-2-1.52M2 8.82a15 15 0 0 1 4.18-2.64M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20"/></svg>Offline</span>
      </div>
      <div class="credit"><span class="plat">Web<i>·</i>PWA<i>·</i>Android<i>·</i></span>built with <span class="heart">&#x2665;&#xFE0E;</span> by <b>Hex</b></div>
    </div>

    <div class="vignette"></div>
    <div class="grain" id="g1"></div>
    <div class="grain fine" id="g2"></div>
  </div>
  <script>
    document.getElementById('stage').className = 'stage ' + (location.hash.slice(1) || 'social')
    // film grain at the device's pixel density, so every speck is one real pixel (like the app)
    function noise(size, contrast) {
      const c = document.createElement('canvas'), d = devicePixelRatio || 1
      c.width = c.height = Math.round(size * d)
      const g = c.getContext('2d'), img = g.createImageData(c.width, c.height)
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (Math.random() - .5) * 255 * contrast
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255
      }
      g.putImageData(img, 0, 0)
      return `url(${c.toDataURL()}) 0 0 / ${size}px ${size}px repeat`
    }
    document.getElementById('g1').style.background = noise(300, 1)
    document.getElementById('g2').style.background = noise(240, .9)
  </script>
</body>
</html>
