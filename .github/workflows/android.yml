# Android builds, in the cloud — nothing needs to be built on anyone's machine.
#
#   push to main / pull request  →  signed APKs (one per CPU architecture + universal) as a downloadable artifact
#                                    on the run's page (Actions tab → the run → "Artifacts"), kept 30 days
#   push a version tag (v1.2.0)  →  the same, plus a GitHub Release with the APKs, the web build and checksums
#   Actions tab → Run workflow   →  a build; fill in a version to publish a release too
#
# The website itself is built and deployed by Vercel on every push to main.
#
# Signing uses these repository secrets (without them — e.g. pull requests from forks — the APKs are signed with a
# throwaway debug key: they install, but can't update an app signed with the release key):
#   ANDROID_KEYSTORE_BASE64  ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', '.github/assets/**', 'design/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '.github/assets/**', 'design/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      version:
        description: Publish a release with this version (e.g. 1.2.0) — leave empty for just a build
        required: false

concurrency:
  # a newer push to the same branch replaces an older build; tag builds always finish
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then RAW="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then RAW="${{ inputs.version }}"
          else RAW=""; fi
          if [ -n "$RAW" ]; then
            VERSION="${RAW#v}"
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "::error::'$RAW' is not a version like 1.2.0"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # everyday builds: <package version>-build.<run number>, e.g. 1.0.0-build.42
            VERSION="$BASE-build.${GITHUB_RUN_NUMBER}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # monotonically increasing Android versionCode (each ABI APK adds its own last digit)
          echo "code=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (release: $([ -n "$RAW" ] && echo yes || echo no))"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app (type-check included) and sync it into Android
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GRAMOPHONE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — APKs will be signed with a debug key."
          fi

      - name: Build APKs (per ABI + universal)
        working-directory: android
        env:
          GRAMOPHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRAMOPHONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GRAMOPHONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ steps.v.outputs.version }} \
            -PappVersionCode=${{ steps.v.outputs.code }}

      - name: Collect
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p out
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "out/gramophone-$V-$abi.apk"
          done
          (cd dist && zip -qr "../out/gramophone-$V-web.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)
          # which key signed it (shown in the run summary)
          SIGNER=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "out/gramophone-$V-universal.apk" 2>/dev/null | grep -m1 "certificate DN" | sed 's/.*DN: //')
          {
            echo "### Gramophone $V"
            echo
            echo "Signed by: \`${SIGNER:-unknown}\`"
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gramophone-${{ steps.v.outputs.version }}
          path: out/*
          retention-days: 30

      - name: Release notes
        if: steps.v.outputs.release == 'true'
        run: |
          cat > notes.md <<'EOF'
          ### Which APK do I need?
          | File | Devices |
          |---|---|
          | `…-arm64-v8a.apk` | almost every phone from the last ~8 years |
          | `…-armeabi-v7a.apk` | older 32-bit phones |
          | `…-x86_64.apk` / `…-x86.apk` | emulators, Chromebooks, Intel tablets |
          | `…-universal.apk` | any device — pick this if unsure |

          `…-web.zip` is the static web build (installable as a PWA from any static host).
          EOF

      - name: Publish release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Gramophone ${{ steps.v.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: out/*
