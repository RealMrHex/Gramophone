# Builds the Android app and publishes a GitHub Release with one APK per CPU architecture
# (arm64-v8a, armeabi-v7a, x86_64, x86) plus a universal APK, and a zip of the web build.
#
# Run it by pushing a version tag:   git tag v1.2.0 && git push origin v1.2.0
# …or from the Actions tab (Run workflow → enter a version).
#
# Signing (recommended — without it the APKs are signed with a throwaway debug key, so they install but can't be
# updated in place by a later, differently signed build). Add these repository secrets:
#   ANDROID_KEYSTORE_BASE64     base64 of your .jks   (base64 -i release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.2.0) — creates the tag v<version>
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RAW="${{ inputs.version }}"; else RAW="${GITHUB_REF_NAME}"; fi
          VERSION="${RAW#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "::error::'$RAW' is not a version like 1.2.0"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # monotonically increasing Android versionCode (each ABI APK adds its own last digit)
          echo "code=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app and sync it into Android
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GRAMOPHONE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — APKs will be signed with a debug key."
          fi

      - name: Build release APKs (per ABI + universal)
        working-directory: android
        env:
          GRAMOPHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRAMOPHONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GRAMOPHONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ steps.v.outputs.version }} \
            -PappVersionCode=${{ steps.v.outputs.code }}

      - name: Collect artifacts
        id: out
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p out
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "out/gramophone-$V-$abi.apk"
          done
          (cd dist && zip -qr "../out/gramophone-$V-web.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ### Which APK do I need?
          | File | Devices |
          |---|---|
          | `…-arm64-v8a.apk` | almost every phone from the last ~8 years |
          | `…-armeabi-v7a.apk` | older 32-bit phones |
          | `…-x86_64.apk` / `…-x86.apk` | emulators, Chromebooks, Intel tablets |
          | `…-universal.apk` | any device — pick this if unsure |

          `…-web.zip` is the static web build (installable as a PWA from any static host).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Gramophone ${{ steps.v.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: out/*
