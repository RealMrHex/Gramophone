apply plugin: 'com.android.application'

// ── release settings (all optional; local builds work without any of them) ──
//   -PappVersionName=1.4.0 -PappVersionCode=14   version (CI passes the git tag + run number)
//   release signing, first match wins:
//     1. env GRAMOPHONE_KEYSTORE / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD   (CI)
//     2. android/signing/keystore.properties (+ the .jks next to it)                   (your machine, gitignored)
def appVersionName = project.findProperty('appVersionName') ?: '1.0.0'
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()
def signing = [:]
if (System.getenv('GRAMOPHONE_KEYSTORE')) {
    signing = [store: file(System.getenv('GRAMOPHONE_KEYSTORE')), storePassword: System.getenv('GRAMOPHONE_KEYSTORE_PASSWORD'),
               alias: System.getenv('GRAMOPHONE_KEY_ALIAS'), keyPassword: System.getenv('GRAMOPHONE_KEY_PASSWORD')]
} else {
    def propsFile = rootProject.file('signing/keystore.properties')
    if (propsFile.exists()) {
        def p = new Properties(); propsFile.withInputStream { p.load(it) }
        signing = [store: rootProject.file(p.storeFile), storePassword: p.storePassword, alias: p.keyAlias, keyPassword: p.keyPassword]
    }
}
def hasReleaseKey = signing.store && signing.store.exists()
// one APK per CPU architecture (plus a universal one). Each ABI gets its own versionCode so stores / updates
// always pick the right file: <versionCode> * 10 + abi digit.
def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

android {
    namespace = "com.arminnotes.gramophone"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.arminnotes.gramophone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile signing.store
                storePassword signing.storePassword
                keyAlias signing.alias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // without a release key the APKs are signed with the debug key — installable, but not for a store
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    splits {
        abi {
            enable true
            reset()
            include(*(abiCodes.keySet() as List))
            universalApk true
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
            if (abi) output.versionCode.set(appVersionCode * 10 + abiCodes[abi])
            else output.versionCode.set(appVersionCode * 10)
        }
    }
}

if (!hasReleaseKey) logger.lifecycle('Gramophone: no release key (env or android/signing/) — release APKs are signed with the debug key')

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSession + media-style notification (lock screen, quick settings, headset buttons)
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
